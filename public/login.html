<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Veerendra Digital Document Management System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <i class="fas fa-file-shield"></i>
        </a>
        <h2>Welcome Back</h2>
        <p>Sign in to <strong>Veerendra Vault</strong></p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
          <i class="fas fa-sign-in-alt"></i> Sign In to Vault
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/register.html">Create one here</a></p>
        <p style="margin-top: 12px;"><a href="/" style="color: #94a3b8;"><i class="fas fa-arrow-left"></i> Back to Homepage</a></p>
      </div>
    </div>
  </div>

  <script src="/js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('btnLoginSubmit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
          showToast('Please enter both email and password.', 'warning');
          return;
        }

        const origHtml = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            showToast(data.message, 'success');
            setTimeout(() => {
              window.location.href = '/dashboard.html';
            }, 600);
          } else {
            showToast(data.message || 'Invalid login credentials.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = origHtml;
          }
        } catch (err) {
          showToast('Server connection error. Please try again.', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = origHtml;
        }
      });
    });
  </script>
</body>
</html>
